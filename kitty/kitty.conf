# -----------------------------------------------------------------------------
# Font Configuration
# -----------------------------------------------------------------------------
font_family      JetBrainsMono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.25
background_opacity 0.80

# Window Decoration & Layout
# -----------------------------------------------------------------------------
hide_window_decorations yes
# Kali Linux Inspired Theme for Kitty

# Special Colors
#background            #0f141c
#foreground            #ffffff
#cursor                #00a3e0
#cursor_text_color     #0f141c
#selection_background  #1f2d42
#selection_foreground  #ffffff
#
## Window border colors
#active_border_color   #00a3e0
#inactive_border_color #161f2b
#
## Tab bar colors
#active_tab_background   #00a3e0
#active_tab_foreground   #0f141c
#inactive_tab_background #161f2b
#inactive_tab_foreground #7ca1be
#
## Standard Terminal Colors (The 16-color ANSI Palette)
#
## Black / Dark Grey
#color0  #0f141c
#color8  #5c6f82
#
## Red (Exploit / Alert)
#color1  #ff4152
#color9  #ff5264
#
## Green (Success / Shell Prompt)
#color2  #00d473
#color10 #1bf38e
#
## Yellow (Warning / Attention)
#color3  #ffcc00
#color11 #ffe066
#
## Blue (Primary Kali Accent / Directory)
#color4  #00a3e0
#color12 #33bbf2
#
## Magenta (Variables / Crypto)
#color5  #b366ff
#color13 #c68cff
#
## Cyan (Interfaces / Metadata)
#color6  #00e5ff
#color14 #33ebff
#
## White / Light Grey
#color7  #b3c7d6
#color15 #ffffff
#
# -----------------------------------------------------------------------------
# Miscellaneous Settings
# -----------------------------------------------------------------------------
scrollback_lines 10000
detect_urls      yes
enable_audio_bell no

# Enable smooth cursor trail animation
cursor_trail             1
cursor_trail_decay       0.05 0.2
cursor_trail_start_threshold 0

# Force block cursor for a prominent trail effect
cursor_shape             block

# Remap Ctrl+Backspace to send the Ctrl+W hex code (\x17)
map ctrl+backspace send_text all \x17

map ctrl+t send_text all tmux\r



# =====================================================================
# 1. CORE & MOUSE SETTINGS (Bật chuột & Đổi index bắt đầu từ 1)
# =====================================================================
# Bật hỗ trợ chuột (Click chọn tab, pane, kéo giãn cửa sổ)
mouse_hide_wait 3.0
focus_follows_mouse no

# Đổi số thứ tự Tab bắt đầu từ 1 (Giống base-index 1)
tab_bar_index_style numbered
# Note: Kitty mặc định đếm tab từ 1 trong hiển thị giao diện khi dùng kiểu "numbered"

# =====================================================================
# 2. SHORTCUTS - PANE & WINDOWS (Phím tắt chia màn hình & Di chuyển)
# =====================================================================
# Kích hoạt bố cục chia nhỏ màn hình
enabled_layouts splits,stack

# Mở Split ngang giữ nguyên thư mục hiện tại (bind '"')
map ctrl+b>" launch --location=hsplit --cwd=current

# Mở Split dọc giữ nguyên thư mục hiện tại (bind %)
map ctrl+b>% launch --location=vsplit --cwd=current

# Di chuyển giữa các ô chia màn hình (Mặc định của tmux để bạn dễ dùng)
map ctrl+b>left  neighboring_window left
map ctrl+b>right neighboring_window right
map ctrl+b>up    neighboring_window up
map ctrl+b>down  neighboring_window down


# =====================================================================
# 3. APPEARANCE & COLORS (Giao diện màu Kali Linux của bạn)
# =====================================================================
# Vị trí thanh Tab ở dưới đáy (status-position bottom)
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

# --- Tháo xích màu nền (Thanh chứa tab trong suốt / status-style bg=default) ---
tab_bar_background none

# --- Inactive Window (Chữ xám mờ trên nền tối nhẹ / #7ca1be trên #161f2b) ---
inactive_tab_foreground #7ca1be
inactive_tab_background #161f2b
inactive_tab_font_style normal

# --- Active Window (Chữ tối #0f141c trên nền Xanh Kali #00a3e0,bold) ---
active_tab_foreground   #0f141c
active_tab_background   #00a3e0
active_tab_font_style   bold

# --- Borders for Panes (Thanh ngăn cách giữa các ô chia màn hình) ---
active_border_color   #00a3e0
inactive_border_color #161f2b
window_border_width   1pt

# Tự động khôi phục lại trạng thái cửa sổ khi mở lại Kitty
remember_window_size  yes
initial_window_width  640
initial_window_height 400

